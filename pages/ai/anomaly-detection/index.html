<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anomaly Detection · Test Results</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #F7F7F6;
  --surface: #FFFFFF;
  --surface2: #F1F0EE;
  --border: rgba(0,0,0,0.08);
  --border-mid: rgba(0,0,0,0.14);
  --text: #1A1A19;
  --text-mid: #555552;
  --text-muted: #888780;
  --blue: #185FA5;
  --blue-bg: #E6F1FB;
  --blue-text: #0C447C;
  --red: #A32D2D;
  --red-bg: #FCEBEB;
  --amber: #854F0B;
  --amber-bg: #FAEEDA;
  --green: #3B6D11;
  --green-bg: #EAF3DE;
  --sidebar-w: 240px;
  --radius: 8px;
  --radius-lg: 12px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
  line-height: 1.5;
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* ── Sidebar ── */
.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: var(--surface);
  border-right: 0.5px solid var(--border-mid);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar-header {
  padding: 16px 16px 12px;
  border-bottom: 0.5px solid var(--border-mid);
}

.sidebar-logo {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text);
  margin-bottom: 2px;
}
.sidebar-logo span { color: var(--blue); }

.sidebar-tagline {
  font-size: 11px;
  color: var(--text-muted);
}

.sidebar-section-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  padding: 14px 16px 6px;
}

.sidebar-runs {
  flex: 1;
  overflow-y: auto;
  padding-bottom: 12px;
}

.run-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 9px 16px;
  cursor: pointer;
  border-radius: 0;
  transition: background 0.1s;
  border-left: 2px solid transparent;
}
.run-item:hover { background: var(--surface2); }
.run-item.active {
  background: var(--blue-bg);
  border-left-color: var(--blue);
}

.run-title {
  font-size: 12px;
  font-weight: 500;
  color: var(--text);
}
.run-item.active .run-title { color: var(--blue-text); }

.run-meta {
  font-size: 11px;
  color: var(--text-muted);
  display: flex;
  gap: 8px;
  align-items: center;
}

.run-pills {
  display: flex;
  gap: 4px;
  margin-top: 4px;
}

.run-pill {
  font-size: 10px;
  font-weight: 500;
  padding: 1px 6px;
  border-radius: 999px;
}
.rp-detect { background: var(--red-bg); color: var(--red); }
.rp-total { background: var(--surface2); color: var(--text-muted); }

.sidebar-footer {
  padding: 12px 16px;
  border-top: 0.5px solid var(--border-mid);
  font-size: 11px;
  color: var(--text-muted);
}

/* ── Main content ── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.topbar {
  background: var(--surface);
  border-bottom: 0.5px solid var(--border-mid);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

.topbar-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
}

.topbar-sub {
  font-size: 12px;
  color: var(--text-muted);
}

.topbar-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
}

.badge-tag {
  font-size: 11px;
  font-weight: 500;
  padding: 3px 10px;
  border-radius: 999px;
}
.badge-ai { background: var(--blue-bg); color: var(--blue-text); }
.badge-threshold { background: var(--surface2); color: var(--text-muted); }

/* ── Stat bar ── */
.stat-bar {
  display: flex;
  gap: 0;
  padding: 12px 24px;
  background: var(--surface);
  border-bottom: 0.5px solid var(--border-mid);
  flex-shrink: 0;
}

.stat-item {
  flex: 1;
  padding: 0 16px 0 0;
  border-right: 0.5px solid var(--border-mid);
  margin-right: 16px;
}
.stat-item:last-child { border-right: none; margin-right: 0; }

.stat-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--text-muted);
  margin-bottom: 3px;
}

.stat-value {
  font-size: 20px;
  font-weight: 600;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.stat-value.red { color: var(--red); }
.stat-value.amber { color: var(--amber); }
.stat-value.green { color: var(--green); }
.stat-value.blue { color: var(--blue); }

.stat-sub {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
}

/* ── Table area ── */
.content {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px 40px;
}

.section-title {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.section-title::after { content: ''; flex: 1; height: 0.5px; background: var(--border-mid); }

.tbl-wrap {
  background: var(--surface);
  border: 0.5px solid var(--border-mid);
  border-radius: var(--radius-lg);
  overflow: hidden;
  margin-bottom: 24px;
}

.tbl-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 14px;
  border-bottom: 0.5px solid var(--border);
}

.tbl-bar-label { font-size: 12px; color: var(--text-muted); }
.tbl-row-count { margin-left: auto; font-size: 11px; color: var(--text-muted); }

.tbl-scroll { overflow-x: auto; }

table { width: 100%; border-collapse: collapse; }

thead tr { background: var(--surface2); }

th {
  padding: 7px 10px;
  text-align: left;
  font-size: 10px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  border-bottom: 0.5px solid var(--border-mid);
  white-space: nowrap;
}

td {
  padding: 8px 10px;
  font-size: 12px;
  color: var(--text);
  border-bottom: 0.5px solid var(--border);
  white-space: nowrap;
}

tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: #FAFAF9; }

.num { text-align: right; font-variant-numeric: tabular-nums; }
.entry-link { color: var(--blue); font-weight: 500; }
.desc-cell { max-width: 200px; overflow: hidden; text-overflow: ellipsis; }

/* flagged row highlight */
tr.flagged td { background: #FFF8F8; }
tr.flagged:hover td { background: #FEEFEF; }

/* risk pill */
.rp {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  border: none;
  font-family: inherit;
  transition: opacity 0.1s;
  white-space: nowrap;
}
.rp:hover { opacity: 0.8; }
.rp-hi { background: var(--red-bg); color: var(--red); }
.rp-md { background: var(--amber-bg); color: var(--amber); }
.rp-lo { background: var(--green-bg); color: var(--green); }
.rp-normal { background: var(--surface2); color: var(--text-muted); }

/* ── Floating popover ── */
#floating-popover {
  display: none;
  position: fixed;
  background: var(--surface);
  border: 0.5px solid var(--border-mid);
  border-radius: var(--radius-lg);
  box-shadow: 0 4px 20px rgba(0,0,0,0.14);
  padding: 14px;
  width: 260px;
  z-index: 9999;
  font-size: 12px;
}
#floating-popover.show { display: block; }

.pop-header {
  margin-bottom: 10px;
}
.pop-entry {
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 2px;
}
.pop-desc {
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 10px;
  white-space: normal;
  line-height: 1.4;
}

.pop-score-row {
  display: flex;
  align-items: baseline;
  gap: 6px;
  margin-bottom: 10px;
  padding-bottom: 10px;
  border-bottom: 0.5px solid var(--border-mid);
}
.pop-score-num {
  font-size: 28px;
  font-weight: 700;
  line-height: 1;
}
.pop-score-label {
  font-size: 11px;
  color: var(--text-muted);
}

.pop-section-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--text-muted);
  margin-bottom: 6px;
}

.pop-factor {
  display: grid;
  grid-template-columns: 1fr auto auto;
  align-items: center;
  gap: 4px 8px;
  padding: 5px 0;
  border-bottom: 0.5px solid var(--border);
}
.pop-factor:last-child { border-bottom: none; }
.pop-factor-name { font-size: 11px; color: var(--text-mid); }
.pop-factor-score {
  font-size: 11px;
  font-weight: 600;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.pop-factor-bar-wrap {
  width: 48px;
  height: 4px;
  background: var(--surface2);
  border-radius: 2px;
  overflow: hidden;
}
.pop-factor-bar {
  height: 100%;
  border-radius: 2px;
  background: var(--text-muted);
  transition: width 0.2s;
}
.bar-hi { background: var(--red); }
.bar-md { background: var(--amber); }
.bar-lo { background: var(--green); }
.bar-none { background: var(--border-mid); }

.pop-signals {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 0.5px solid var(--border-mid);
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.signal-chip {
  font-size: 10px;
  font-weight: 500;
  padding: 2px 7px;
  border-radius: 999px;
  background: var(--red-bg);
  color: var(--red);
}

/* ── Injected entry reason pill ── */
.injected-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 500;
  padding: 1px 6px;
  border-radius: 999px;
  background: #EDE9FD;
  color: #5B3DB3;
  margin-left: 4px;
}

/* ── Miss badge ── */
.miss-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 500;
  padding: 1px 6px;
  border-radius: 999px;
  background: var(--amber-bg);
  color: var(--amber);
}

</style>
</head>

// ─────────────────────────────────────────────────────────────────
// Rendering helpers
// ─────────────────────────────────────────────────────────────────
let activeRunId = TEST_RUNS[0].id;
let activeTrigger = null;

function fmt(n) {
  if (n === 0) return '—';
  return Math.abs(n).toLocaleString('en-IN');
}

function scoreClass(s) {
  if (s >= 0.70) return 'rp-hi';
  if (s >= 0.45) return 'rp-md';
  return 'rp-lo';
}

function scoreColor(s) {
  if (s >= 0.70) return 'var(--red)';
  if (s >= 0.45) return 'var(--amber)';
  return 'var(--green)';
}

function barClass(s) {
  if (s >= 0.70) return 'bar-hi';
  if (s >= 0.40) return 'bar-md';
  if (s > 0) return 'bar-lo';
  return 'bar-none';
}

function factorLabel(type) {
  return { numericOutlier: 'Numeric outlier', behavioralAnomaly: 'Behavioral', semanticAnomaly: 'Semantic' }[type] || type;
}

// ─────────────────────────────────────────────────────────────────
// Popover
// ─────────────────────────────────────────────────────────────────
const floatingPop = document.getElementById('floating-popover');

function showPopover(btn, entry) {
  const ad = entry.anomalyDetection;
  const scoreStr = ad.score.toFixed(4);

  let factorsHtml = ad.factors.map(f => {
    const pct = Math.round(f.score * 100);
    return `
      <div class="pop-factor">
        <span class="pop-factor-name">${factorLabel(f.type)} <span style="color:var(--text-muted);font-size:10px">w=${f.weight}</span></span>
        <span class="pop-factor-score" style="color:${scoreColor(f.score)}">${f.score.toFixed(4)}</span>
        <div class="pop-factor-bar-wrap">
          <div class="pop-factor-bar ${barClass(f.score)}" style="width:${pct}%"></div>
        </div>
      </div>`;
  }).join('');

  let signalsHtml = '';
  if (entry.injectedSignals && entry.injectedSignals.length) {
    const chips = entry.injectedSignals.map(s => `<span class="signal-chip">${s}</span>`).join('');
    signalsHtml = `<div class="pop-signals">${chips}</div>`;
  }

  let missHtml = '';
  if (entry.missReason) {
    missHtml = `
      <div style="margin-top:8px;padding:8px;background:var(--amber-bg);border-radius:6px;font-size:11px;color:var(--amber);line-height:1.5">
        <strong style="display:block;margin-bottom:2px">Why missed</strong>${entry.missReason}
      </div>`;
  }

  floatingPop.innerHTML = `
    <div class="pop-header">
      <div class="pop-entry">${entry.entryNo} · GL ${entry.glNumber}</div>
      <div class="pop-desc">${entry.description}</div>
    </div>
    <div class="pop-score-row">
      <span class="pop-score-num" style="color:${scoreColor(ad.score)}">${scoreStr}</span>
      <span class="pop-score-label">composite score<br>${ad.detected ? '<span style="color:var(--red);font-weight:600">● DETECTED</span>' : '<span style="color:var(--text-muted)">○ not detected</span>'}</span>
    </div>
    <div class="pop-section-label">Rule factors</div>
    ${factorsHtml}
    ${signalsHtml}
    ${missHtml}
  `;

  floatingPop.classList.add('show');

  const rect = btn.getBoundingClientRect();
  const popW = 260;
  let left = rect.left + rect.width / 2 - popW / 2;
  left = Math.max(8, Math.min(left, window.innerWidth - popW - 8));
  floatingPop.style.left = left + 'px';
  floatingPop.style.top = '0px';

  requestAnimationFrame(() => {
    const popH = floatingPop.getBoundingClientRect().height;
    let top = rect.top - popH - 8;
    if (top < 8) top = rect.bottom + 8;
    floatingPop.style.top = top + 'px';
  });
}

document.addEventListener('click', e => {
  const btn = e.target.closest('.rp[data-idx]');
  if (btn) {
    const runId = btn.dataset.run;
    const idx = parseInt(btn.dataset.idx, 10);
    const run = TEST_RUNS.find(r => r.id === runId);
    const pool = btn.dataset.pool === 'injected' ? run.injected : run.normal;
    const entry = pool[idx];

    if (activeTrigger === btn && floatingPop.classList.contains('show')) {
      floatingPop.classList.remove('show');
      activeTrigger = null;
    } else {
      activeTrigger = btn;
      showPopover(btn, entry);
    }
    e.stopPropagation();
  } else if (!e.target.closest('#floating-popover')) {
    floatingPop.classList.remove('show');
    activeTrigger = null;
  }
});

// ─────────────────────────────────────────────────────────────────
// Sidebar
// ─────────────────────────────────────────────────────────────────
function renderSidebar() {
  const container = document.getElementById('sidebar-runs');
  container.innerHTML = '';

  TEST_RUNS.forEach(run => {
    const detected = run.injected.filter(e => e.anomalyDetection.detected).length;
    const total = run.injected.length;

    const item = document.createElement('div');
    item.className = 'run-item' + (run.id === activeRunId ? ' active' : '');
    item.innerHTML = `
      <div class="run-title">${run.title}</div>
      <div class="run-meta">${run.date} · threshold ${run.threshold}</div>
      <div class="run-pills">
        <span class="run-pill rp-detect">${detected} detected</span>
        <span class="run-pill rp-total">${total} injected</span>
      </div>
    `;
    item.addEventListener('click', () => {
      activeRunId = run.id;
      renderSidebar();
      renderMain();
    });
    container.appendChild(item);
  });
}

// ─────────────────────────────────────────────────────────────────
// Main content
// ─────────────────────────────────────────────────────────────────
function renderMain() {
  const run = TEST_RUNS.find(r => r.id === activeRunId);
  if (!run) return;

  const detected = run.injected.filter(e => e.anomalyDetection.detected).length;
  const missed = run.injected.length - detected;
  const avgDetectedScore = run.injected
    .filter(e => e.anomalyDetection.detected)
    .reduce((s, e) => s + e.anomalyDetection.score, 0) / (detected || 1);
  const avgNormalScore = run.normal
    .reduce((s, e) => s + e.anomalyDetection.score, 0) / (run.normal.length || 1);

  document.getElementById('run-title').textContent = run.title;
  document.getElementById('run-subtitle').textContent = run.description;
  document.getElementById('threshold-badge').textContent = `threshold ${run.threshold}`;

  // stat bar
  document.getElementById('stat-bar').innerHTML = `
    <div class="stat-item">
      <div class="stat-label">Injected entries</div>
      <div class="stat-value blue">${run.injected.length}</div>
      <div class="stat-sub">claude_bot</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">Detected</div>
      <div class="stat-value red">${detected}</div>
      <div class="stat-sub">${Math.round(detected/run.injected.length*100)}% detection rate</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">Missed</div>
      <div class="stat-value amber">${missed}</div>
      <div class="stat-sub">below threshold</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">Avg detected score</div>
      <div class="stat-value red">${avgDetectedScore.toFixed(4)}</div>
      <div class="stat-sub">vs ${avgNormalScore.toFixed(4)} normal avg</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">Top scoring normal</div>
      <div class="stat-value">${run.normal.length}</div>
      <div class="stat-sub">highest scored, no flag</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">Threshold</div>
      <div class="stat-value" style="font-size:16px">${run.threshold}</div>
      <div class="stat-sub">weighted avg · detect if ≥</div>
    </div>
  `;

  // content
  const content = document.getElementById('content');
  content.innerHTML = '';

  // injected section
  const detectedEntries = run.injected.filter(e => e.anomalyDetection.detected);
  const missedEntries = run.injected.filter(e => !e.anomalyDetection.detected);

  if (detectedEntries.length) {
    content.innerHTML += `<div class="section-title">Detected — ${detectedEntries.length} flagged entries</div>`;
    content.innerHTML += buildTable(run, run.injected.filter(e => e.anomalyDetection.detected).map(e => ({...e, _pool: 'injected', _origIdx: run.injected.indexOf(e)})), true);
  }

  if (missedEntries.length) {
    content.innerHTML += `<div class="section-title" style="margin-top:8px">Missed — ${missedEntries.length} injected but not detected <span style="font-size:10px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--amber)">click score for reason</span></div>`;
    content.innerHTML += buildTable(run, run.injected.filter(e => !e.anomalyDetection.detected).map(e => ({...e, _pool: 'injected', _origIdx: run.injected.indexOf(e)})), true);
  }

  content.innerHTML += `<div class="section-title" style="margin-top:8px">Top 20 highest-scored real entries (no flag) — sorted by score desc</div>`;
  content.innerHTML += buildTable(run, run.normal.map((e, i) => ({...e, _pool: 'normal', _origIdx: i})), false);
}

function buildTable(run, entries, isInjected) {
  const rows = entries.map(entry => {
    const ad = entry.anomalyDetection;
    const rpClass = ad.detected ? scoreClass(ad.score) : (isInjected ? 'rp-md' : 'rp-normal');
    const rowClass = ad.detected ? 'flagged' : '';
    const injBadge = isInjected ? `<span class="injected-badge">injected</span>` : '';
    const missBadge = isInjected && !ad.detected ? `<span class="miss-badge">missed</span>` : '';

    return `
      <tr class="${rowClass}">
        <td>${entry.postingDate}</td>
        <td>${entry.transactionType}</td>
        <td class="entry-link">${entry.entryNo}${injBadge}${missBadge}</td>
        <td>${entry.glNumber}</td>
        <td style="max-width:140px;overflow:hidden;text-overflow:ellipsis">${entry.name}</td>
        <td>${entry.currency}</td>
        <td class="num">${entry.debit ? fmt(entry.debit) : '—'}</td>
        <td class="num">${entry.credit ? fmt(entry.credit) : '—'}</td>
        <td class="desc-cell" title="${entry.description}">${entry.description}</td>
        <td>${entry.postingBy}</td>
        <td style="text-align:center">
          <button class="rp ${rpClass}" data-idx="${entry._origIdx}" data-pool="${entry._pool}" data-run="${run.id}">
            ${ad.score.toFixed(4)} ▾
          </button>
        </td>
      </tr>`;
  }).join('');

  return `
    <div class="tbl-wrap">
      <div class="tbl-bar">
        <span class="tbl-bar-label">General Ledger · ${run.sourceId}</span>
        <span class="tbl-row-count">${entries.length} entries</span>
      </div>
      <div class="tbl-scroll">
        <table>
          <thead>
            <tr>
              <th style="min-width:90px">Date</th>
              <th style="min-width:100px">Type</th>
              <th style="min-width:130px">Entry No</th>
              <th style="min-width:55px">GL No</th>
              <th style="min-width:140px">Name</th>
              <th style="min-width:40px">Ccy</th>
              <th class="num" style="min-width:80px">Debit</th>
              <th class="num" style="min-width:80px">Credit</th>
              <th style="min-width:160px">Description</th>
              <th style="min-width:90px">Posted by</th>
              <th style="min-width:75px;text-align:center">Score ▾</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
}

// ─────────────────────────────────────────────────────────────────
// Init

renderSidebar();
